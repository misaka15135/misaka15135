name: Update profile widgets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/profile-widgets.yml

concurrency:
  group: profile-widgets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&theme=tokyonight&bg_color=111d36&title_color=a5b4fc&icon_color=7dd3fc&text_color=cbd5e1&hide_border=true&border_radius=12&custom_title=GitHub%20Stats&locale=en
          path: assets/generated/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate language distribution
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=tokyonight&bg_color=111d36&title_color=a5b4fc&text_color=cbd5e1&hide_border=true&border_radius=12&locale=en
          path: assets/generated/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/contribution-snake.svg?color_snake=#8b5cf6&color_dots=#ebedf0,#ddd6fe,#a5b4fc,#818cf8,#6366f1
            assets/generated/contribution-snake-dark.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#161b22,#26365c,#465da5,#818cf8,#c4b5fd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate WakaTime statistics
        if: ${{ vars.WAKATIME_USERNAME != '' }}
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: wakatime
          options: username=${{ vars.WAKATIME_USERNAME }}&layout=compact&langs_count=6&theme=tokyonight&bg_color=111d36&title_color=a5b4fc&text_color=cbd5e1&hide_border=true&border_radius=12&locale=en
          path: assets/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Report WakaTime connection status
        if: ${{ vars.WAKATIME_USERNAME == '' }}
        run: echo "WakaTime is not connected yet. See .github/WAKATIME_SETUP.md."

      - name: Publish updated widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated assets/wakatime.svg
          if git diff --cached --quiet; then
            echo "No widget changes to publish."
            exit 0
          fi
          git commit -m "Refresh profile statistics and contribution snake"
          git pull --rebase origin main
          git push origin HEAD:main
