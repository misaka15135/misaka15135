name: Update profile widgets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/profile-widgets.yml
      - .github/scripts/**
      - package.json
      - package-lock.json

concurrency:
  group: profile-widgets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install widget dependencies
        run: npm ci

      - name: Check activity validation and public-data filtering
        run: npm test

      - name: Generate validated statistics and contribution snakes
        run: npm run refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate WakaTime statistics
        if: ${{ vars.WAKATIME_USERNAME != '' }}
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: wakatime
          options: username=${{ vars.WAKATIME_USERNAME }}&layout=compact&langs_count=6&theme=tokyonight&bg_color=111d36&title_color=a5b4fc&text_color=cbd5e1&hide_border=true&border_radius=12&locale=en
          path: assets/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Report WakaTime connection status
        if: ${{ vars.WAKATIME_USERNAME == '' }}
        run: echo "WakaTime is not connected yet. See .github/WAKATIME_SETUP.md."

      - name: Publish updated widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated assets/wakatime.svg
          if git diff --cached --quiet; then
            echo "No widget changes to publish."
            exit 0
          fi
          git commit -m "Refresh profile statistics and contribution snake"
          git pull --rebase origin main
          git push origin HEAD:main
